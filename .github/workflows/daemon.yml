name: daemon

on:
  push:
    branches: [master]
    paths:
      - "daemon/**"
      - ".github/workflows/daemon.yml"
  pull_request:
    paths:
      - "daemon/**"
      - ".github/workflows/daemon.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daemon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: daemon
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...
