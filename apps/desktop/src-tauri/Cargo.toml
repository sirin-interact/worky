[package]
name = "worky"
version = "0.1.0"
description = "Worky desktop shell"
license = "AGPL-3.0-only"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name on
# Windows. See https://github.com/rust-lang/cargo/issues/8519
name = "worky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
